<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List RevoU - Proyek Mini</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Apa rencana Anda hari ini?" required>
            <input type="date" id="date-input" required>
            <button type="submit" id="add-button">Tambah Tugas</button>
        </form>

        <div class="filter-buttons">
            <button type="button" class="btn-filter filter-all" onclick="filterTodo('all')">Semua</button>
            <button type="button" class="btn-filter filter-done" onclick="filterTodo('completed')">Selesai</button>
            <button type="button" class="btn-filter filter-undone" onclick="filterTodo('uncompleted')">Belum Selesai</button>
        </div>

        <ul id="todo-list"></ul>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
